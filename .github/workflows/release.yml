name: release

# Binary-only releases per ROS 2 distro branch.
#
#   git tag foxy-v1.0.0   <commit on m20-foxy>   && git push origin foxy-v1.0.0
#   git tag humble-v1.0.0 <commit on m20-humble> && git push origin humble-v1.0.0
#
# or run it manually (workflow_dispatch) from the branch — the tag/release is
# then created at the dispatched commit.
#
# Each release carries: a native install-tree tarball, a docker image tarball
# (for offline `docker load`), and SHA256SUMS. The image is also pushed to
# ghcr.io. A no-source audit fails the job if any C/C++/Python source or header
# ends up in an artifact. Note: GitHub itself attaches auto-generated
# "Source code" archive links to every release; those cannot be disabled — the
# uploaded assets are what this workflow controls, and they are binary-only.

on:
  push:
    tags:
      - 'foxy-v*'
      - 'humble-v*'
  workflow_dispatch:
    inputs:
      distro:
        description: 'ROS 2 distro'
        required: true
        type: choice
        options:
          - foxy
          - humble
      version:
        description: 'Version (X.Y.Z) — the tag/release becomes <distro>-v<version>'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Native arm64 — the deployment architecture. Free for public repositories.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Resolve distro, version, image name
        id: rv
        env:
          IN_DISTRO: ${{ inputs.distro }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            distro="${IN_DISTRO}"
            version="${IN_VERSION}"
          else
            tag="${GITHUB_REF_NAME}"
            distro="${tag%%-v*}"
            version="${tag#*-v}"
          fi
          {
            echo "distro=${distro}"
            echo "version=${version}"
            echo "tag=${distro}-v${version}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fixposition-driver-m20"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build runtime image
        # The shared Dockerfile builds fpsdk_common with the Foxy-only BagWriter patch.
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          IMAGE: ${{ steps.rv.outputs.image }}
        run: |
          docker build -f release/Dockerfile --target runtime \
            --build-arg ROS_DISTRO="${DISTRO}" \
            -t "${IMAGE}:${DISTRO}-${VERSION}" \
            -t "${IMAGE}:${DISTRO}-latest" .

      - name: No-source audit (image)
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          IMAGE: ${{ steps.rv.outputs.image }}
        run: |
          bad="$(docker run --rm --entrypoint /usr/bin/find "${IMAGE}:${DISTRO}-${VERSION}" \
            /opt/fixposition \
            \( -type d -name include \) -print -o \
            \( -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hpp' -o -name '*.hh' -o -name '*.hxx' \) \) -print -o \
            \( -type f -name '*.py' ! -name '_local_setup_util*' \) -print)"
          if [ -n "${bad}" ]; then
            echo "::error::source files found in the release image:"
            echo "${bad}"
            exit 1
          fi
          echo "image audit clean — binaries only"

      - name: Stage native tarball
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          IMAGE: ${{ steps.rv.outputs.image }}
        run: |
          cid="$(docker create "${IMAGE}:${DISTRO}-${VERSION}")"
          mkdir -p stage
          docker cp "${cid}:/opt/fixposition" stage/fixposition-driver-m20
          docker rm "${cid}" > /dev/null
          # On the robot (Foxy, native) drdds is a system package; shipping a
          # second copy in the native tarball would shadow it. The docker image
          # keeps its own vendored build and stays self-contained.
          if [ "${DISTRO}" = "foxy" ]; then
            rm -rf stage/fixposition-driver-m20/install/drdds
          fi

      - name: No-source audit (native tarball tree)
        run: |
          bad="$(find stage \( -type d -name include \) -print -o \
            \( -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hpp' -o -name '*.hh' -o -name '*.hxx' \) \) -print -o \
            \( -type f -name '*.py' ! -name '_local_setup_util*' \) -print)"
          if [ -n "${bad}" ]; then
            echo "::error::source files found in the native tarball tree:"
            echo "${bad}"
            exit 1
          fi
          echo "native tree audit clean — binaries only"

      - name: Pack assets
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          IMAGE: ${{ steps.rv.outputs.image }}
        run: |
          mkdir -p out
          tar -C stage -czf "out/fixposition-driver-m20_${VERSION}_${DISTRO}_arm64.tar.gz" fixposition-driver-m20
          docker save "${IMAGE}:${DISTRO}-${VERSION}" | gzip \
            > "out/fixposition-driver-m20_${VERSION}_${DISTRO}_arm64_docker-image.tar.gz"
          ( cd out && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Push image to ghcr.io
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          IMAGE: ${{ steps.rv.outputs.image }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${DISTRO}-${VERSION}"
          docker push "${IMAGE}:${DISTRO}-latest"

      - name: Create GitHub release
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          TAG: ${{ steps.rv.outputs.tag }}
          IMAGE: ${{ steps.rv.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Binary-only release of the M20 fixposition driver for ROS 2 **${DISTRO}** (arm64)."
            echo
            echo "## Assets"
            echo
            echo "| asset | contents |"
            echo "|---|---|"
            echo "| \`fixposition-driver-m20_${VERSION}_${DISTRO}_arm64.tar.gz\` | native install tree: \`fpsdk/\` + \`install/\` + \`env.sh\` |"
            echo "| \`..._docker-image.tar.gz\` | \`docker load\`-able image (also at \`${IMAGE}:${DISTRO}-${VERSION}\`) |"
            echo "| \`SHA256SUMS.txt\` | checksums for both |"
            echo
            echo "No source code is included in the assets: no headers, no C/C++ sources, no"
            echo "python bindings — shared libraries, executables and interface/launch/config"
            echo "share files only, enforced by the workflow's no-source audit. (The"
            echo "\"Source code\" links below the assets are auto-generated by GitHub for every"
            echo "release and cannot be disabled.)"
            echo
            echo "## Native deployment"
            echo
            echo '```bash'
            echo "tar -xzf fixposition-driver-m20_${VERSION}_${DISTRO}_arm64.tar.gz"
            echo "source fixposition-driver-m20/env.sh"
            echo "ros2 run fixposition_driver_ros2 fixposition_driver_ros2_exec \\"
            echo "    --ros-args --params-file /path/to/your.yaml"
            echo '```'
            if [ "${DISTRO}" = "foxy" ]; then
              echo
              echo "The Foxy native tarball does **not** ship \`drdds\` — on the robot it is a"
              echo "system package and a vendored copy would shadow it. The docker image is"
              echo "self-contained and includes its own drdds build."
            fi
            echo
            echo "## Docker deployment"
            echo
            echo '```bash'
            echo "docker load < fixposition-driver-m20_${VERSION}_${DISTRO}_arm64_docker-image.tar.gz"
            echo "docker run --rm --network host -v /dev/shm:/dev/shm \\"
            echo "    -v /path/to/your.yaml:/config/fixposition.yaml \\"
            echo "    ${IMAGE}:${DISTRO}-${VERSION}"
            echo '```'
            echo
            echo "**Both flags are mandatory, and omitting either fails silently** (the node runs"
            echo "and publishes, but never receives — no crash, no error):"
            echo
            echo "- \`--network host\` — the sensor/OEM traffic lives on the host's interfaces."
            echo "- \`-v /dev/shm:/dev/shm\` — Fast DDS's shared-memory transport lives in POSIX shm"
            echo "  files. With docker's default private 64 MB \`/dev/shm\` a container cannot see"
            echo "  host publishers. Measured on the M20 (2026-08-08): host namespace receives the"
            echo "  OEM cloud immediately; private \`/dev/shm\` receives nothing across repeated"
            echo "  probes; private IPC namespace with the host \`/dev/shm\` receives normally — so"
            echo "  \`/dev/shm\` is the load-bearing flag (\`--ipc host\` also works, being a superset)."
            echo
            echo "On the M20 robot use \`--network host\` (or \`none\`) only — never the default"
            echo "bridge network: creating a bridge veth there triggers a kernel RTNL deadlock that"
            echo "wedges the whole host until a power cycle."
          } > notes.md
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "M20 driver ${DISTRO} v${VERSION} (binary-only)" \
            --notes-file notes.md \
            out/*
